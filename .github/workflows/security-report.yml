name: Security Report Notification

on:
  issues:
    types: [opened, labeled]

jobs:
  notify:
    if: |
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'security')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'security')
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Sabdo Pandito Ratu - Vulnerability Report"
          to: hello@optimaseo.id
          from: GitHub Security Bot
          body: |
            A new security vulnerability has been reported.

            Issue: ${{ github.event.issue.html_url }}
            Title: ${{ github.event.issue.title }}
            Author: ${{ github.event.issue.user.login }}

            ---
            This is an automated notification from the Sabdo Pandito Ratu repository.
